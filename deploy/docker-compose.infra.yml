services:
  reverse-proxy:
    image: caddy:2.10.2-alpine
    container_name: church-erp-reverse-proxy
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      DEV_DOMAIN: ${DEV_DOMAIN:?Set DEV_DOMAIN}
      STG_DOMAIN: ${STG_DOMAIN:?Set STG_DOMAIN}
      PROD_DOMAIN: ${PROD_DOMAIN:?Set PROD_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  mysql-core:
    build:
      context: ./mysql
      dockerfile: Dockerfile
    image: church-erp-mysql:8.4.8
    container_name: church-erp-mysql
    restart: unless-stopped
    init: true
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      DEV_DB_USERNAME: ${DEV_DB_USERNAME:-church_erp_dev}
      DEV_DB_PASSWORD_FILE: /run/secrets/dev_db_password
      STG_DB_USERNAME: ${STG_DB_USERNAME:-church_erp_stg}
      STG_DB_PASSWORD_FILE: /run/secrets/stg_db_password
      PROD_DB_USERNAME: ${PROD_DB_USERNAME:-church_erp_prod}
      PROD_DB_PASSWORD_FILE: /run/secrets/prod_db_password
    secrets:
      - mysql_root_password
      - dev_db_password
      - stg_db_password
      - prod_db_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$(cat /run/secrets/mysql_root_password)\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  edge:
    name: church-erp-edge
  database:
    name: church-erp-database

secrets:
  mysql_root_password:
    file: ${DEPLOY_SECRETS_DIR:?Set DEPLOY_SECRETS_DIR}/mysql-root-password
  dev_db_password:
    file: ${DEPLOY_SECRETS_DIR:?Set DEPLOY_SECRETS_DIR}/dev-db-password
  stg_db_password:
    file: ${DEPLOY_SECRETS_DIR:?Set DEPLOY_SECRETS_DIR}/stg-db-password
  prod_db_password:
    file: ${DEPLOY_SECRETS_DIR:?Set DEPLOY_SECRETS_DIR}/prod-db-password

volumes:
  caddy_data:
  caddy_config:
  mysql_data:
