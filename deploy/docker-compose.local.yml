services:
  reverse-proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web-dev
      - api-dev
    networks:
      - edge

  mysql-core:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      DEV_DB_USERNAME: ${DEV_DB_USERNAME:-church_erp_dev}
      DEV_DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
      STG_DB_USERNAME: ${STG_DB_USERNAME:-church_erp_stg}
      STG_DB_PASSWORD: ${STG_DB_PASSWORD:?Set STG_DB_PASSWORD}
      PROD_DB_USERNAME: ${PROD_DB_USERNAME:-church_erp_prod}
      PROD_DB_PASSWORD: ${PROD_DB_PASSWORD:?Set PROD_DB_PASSWORD}
    volumes:
      - mysql_local_data:/var/lib/mysql
      - ./mysql/init/01-create-databases.sh:/docker-entrypoint-initdb.d/01-create-databases.sh:ro
    networks:
      - backend

  api-dev:
    build:
      context: ../church-erp-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: Church ERP API Local
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080/api
      APP_KEY: ${API_LOCAL_APP_KEY:?Set API_LOCAL_APP_KEY}
      DB_CONNECTION: mysql
      DB_HOST: mysql-core
      DB_PORT: 3306
      DB_DATABASE: church_erp_dev
      DB_USERNAME: ${DEV_DB_USERNAME:-church_erp_dev}
      DB_PASSWORD: ${DEV_DB_PASSWORD:?Set DEV_DB_PASSWORD}
      INTERNAL_API_AUDIENCE: church-erp-api-local
      INTERNAL_API_ISSUER: church-erp-web-local
      INTERNAL_JWT_PUBLIC_KEY: ${LOCAL_INTERNAL_JWT_PUBLIC_KEY:?Set LOCAL_INTERNAL_JWT_PUBLIC_KEY}
    volumes:
      - api_local_storage:/var/www/html/storage
    depends_on:
      - mysql-core
    networks:
      - edge
      - backend

  web-dev:
    build:
      context: ../church-erp-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: Church ERP Local
        NEXT_PUBLIC_APP_URL: http://localhost:8080
        API_BASE_URL: http://api-dev:8000
        INTERNAL_API_AUDIENCE: church-erp-api-local
        INTERNAL_API_ISSUER: church-erp-web-local
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_APP_NAME: Church ERP Local
      NEXT_PUBLIC_APP_URL: http://localhost:8080
      API_BASE_URL: http://api-dev:8000
      INTERNAL_API_AUDIENCE: church-erp-api-local
      INTERNAL_API_ISSUER: church-erp-web-local
      INTERNAL_JWT_PRIVATE_KEY: ${LOCAL_INTERNAL_JWT_PRIVATE_KEY:?Set LOCAL_INTERNAL_JWT_PRIVATE_KEY}
    depends_on:
    - api-dev
    networks:
      - edge

networks:
  edge:
  backend:

volumes:
  mysql_local_data:
  api_local_storage:
